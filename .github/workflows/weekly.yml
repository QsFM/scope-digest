name: weekly-digest
on:
  schedule:
    - cron: "0 23 * * 3"   # 목요일 08:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          KHU_API_KEY: ${{ secrets.KHU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          HOME_REPO: ${{ secrets.HOME_REPO }}
          HOME_REPO_TOKEN: ${{ secrets.HOME_REPO_TOKEN }}
      - name: Commit digest
        run: |
          git config user.name "scope-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "digest $(date +%F)" || echo "no changes"
          git push
